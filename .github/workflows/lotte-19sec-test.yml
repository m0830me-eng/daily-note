name: Lotte World Tower 19s Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 19-second test
        env:
          TARGET_INTERVAL: "19"
          RUN_SECONDS: "300"
        run: python -u lotte_worldtower_rate_test.py
