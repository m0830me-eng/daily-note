name: Lotte World Tower Monitor

on:
  workflow_dispatch:
    inputs:
      existing_gv_test:
        description: "현재 실제 GV 1개로 Discord 4종 알림 테스트"
        required: false
        type: boolean
        default: false

  schedule:
    # 한국시간 06:07
    - cron: "7 21 * * *"

    # 한국시간 11:37
    - cron: "37 2 * * *"

    # 한국시간 17:07
    - cron: "7 8 * * *"

    # 한국시간 22:37
    - cron: "37 13 * * *"

    # ★ 자동실행 테스트용 - 한국시간 18:20
    - cron: "20 9 * * *"

permissions:
  contents: write

concurrency:
  group: lotte-worldtower-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set monitoring duration
        id: duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("CRON_SCHEDULE", "")

          # --------------------------------------------------
          # 수동 실행
          # --------------------------------------------------
          if event_name == "workflow_dispatch":
              seconds = 600

          # --------------------------------------------------
          # 자동 실행
          # --------------------------------------------------
          else:
              kst = ZoneInfo("Asia/Seoul")
              now = datetime.now(kst)

              next_times = {
                  # 06:07 실행 -> 11:37 직전까지
                  "7 21 * * *": (11, 37),

                  # 11:37 실행 -> 17:07 직전까지
                  "37 2 * * *": (17, 7),

                  # 17:07 실행 -> 22:37 직전까지
                  "7 8 * * *": (22, 37),

                  # 22:37 실행 -> 자정 직전까지
                  "37 13 * * *": (0, 0),

                  # --------------------------------------------------
                  # 자동실행 테스트용 18:20
                  # 테스트 실행은 10분만
                  # --------------------------------------------------
                  "20 9 * * *": None,
              }

              # 테스트용 18:20 자동 실행
              if schedule == "20 9 * * *":
                  seconds = 600

              else:
                  hour, minute = next_times[schedule]

                  target = now.replace(
                      hour=hour,
                      minute=minute,
                      second=0,
                      microsecond=0,
                  )

                  if target <= now:
                      target += timedelta(days=1)

                  # 다음 자동 실행 또는 자정 1분 전에 종료
                  seconds = max(
                      60,
                      int((target - now).total_seconds()) - 60,
                  )

          print(f"RUN_SECONDS={seconds}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"seconds={seconds}\n")
          PY

      - name: Run Lotte World Tower monitor
        env:
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}

          # 기존 GitHub Secrets
          DISCORD_LOTTE_WORLDTOWER: ${{ secrets.LW_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}

          # 수동 실행에서 체크했을 때만
          # 현재 실제 GV 1개로 Discord 4종 알림 테스트
          LOTTE_EXISTING_GV_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_gv_test && '1' || '0' }}

        run: |
          python -u lotte_worldtower_rate_test.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_lotte_worldtower.json baseline_lotte_worldtower.done 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update Lotte World Tower alarm state"
            git pull --rebase
            git push
          fi
