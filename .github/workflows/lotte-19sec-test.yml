name: Lotte World Tower Monitor

on:
  workflow_dispatch:
    inputs:
      existing_gv_test:
        description: "현재 실제 GV 1개로 Discord 4종 알림 테스트"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "7 21 * * *"      # 06:07 KST
    - cron: "37 2 * * *"      # 11:37 KST
    - cron: "7 8 * * *"       # 17:07 KST
    - cron: "37 13 * * *"     # 22:37 KST

    # 임시 자동실행 테스트
    - cron: "40 9 * * *"      # 18:40 KST -> 22:37 직전까지 감시

permissions:
  contents: write

concurrency:
  group: lotte-worldtower-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set monitoring duration
        id: duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          EXISTING_GV_TEST: ${{ inputs.existing_gv_test }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("CRON_SCHEDULE", "")
          gv_test = os.environ.get("EXISTING_GV_TEST", "").lower() == "true"
          now = datetime.now(ZoneInfo("Asia/Seoul"))

          # GV 4종 수동 테스트만 10분
          if event_name == "workflow_dispatch" and gv_test:
              print("seconds=600")
              raise SystemExit

          # 정규 예약 실행
          next_times = {
              "7 21 * * *": (11, 37),    # 06:07 -> 11:37
              "37 2 * * *": (17, 7),     # 11:37 -> 17:07
              "7 8 * * *": (22, 37),     # 17:07 -> 22:37
              "40 9 * * *": (22, 37),    # 임시 18:40 -> 22:37
              "37 13 * * *": (0, 0),     # 22:37 -> 24:00
          }

          def seconds_until(hour, minute, next_day=False):
              if next_day:
                  target = (now + timedelta(days=1)).replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
              else:
                  target = now.replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
                  if target <= now:
                      target += timedelta(days=1)
              return max(60, int((target - now).total_seconds()) - 60)

          if event_name == "schedule":
              if schedule not in next_times:
                  print("seconds=600")
                  raise SystemExit

              hour, minute = next_times[schedule]
              if hour == 0 and minute == 0:
                  print(f"seconds={seconds_until(0, 0, next_day=True)}")
              else:
                  print(f"seconds={seconds_until(hour, minute)}")
              raise SystemExit

          # 일반 수동 실행:
          # 현재 시각부터 다음 정규 자동실행 직전까지 계속 감시
          h, m = now.hour, now.minute

          if (h, m) < (6, 7):
              target = now.replace(hour=6, minute=7, second=0, microsecond=0)
          elif (h, m) < (11, 37):
              target = now.replace(hour=11, minute=37, second=0, microsecond=0)
          elif (h, m) < (17, 7):
              target = now.replace(hour=17, minute=7, second=0, microsecond=0)
          elif (h, m) < (22, 37):
              target = now.replace(hour=22, minute=37, second=0, microsecond=0)
          else:
              target = (now + timedelta(days=1)).replace(
                  hour=0, minute=0, second=0, microsecond=0
              )

          seconds = max(60, int((target - now).total_seconds()) - 60)
          print(f"seconds={seconds}")
          PY

      - name: Run
        env:
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
          DISCORD_LOTTE_WORLDTOWER: ${{ secrets.LW_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          LOTTE_EXISTING_GV_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_gv_test && '1' || '0' }}
        run: |
          python -u lotte_worldtower_rate_test.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_lotte_worldtower.json baseline_lotte_worldtower.done 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update Lotte World Tower state"
            git pull --rebase
            git push
          fi
